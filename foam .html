<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
</head>
<body>
<h1>Contact Us</h1>
<p>
We would love to hear from you. Please fill out the form below
and send us your message. We will get back to you as soon as possible.
</p>
<form action="#" method="post">
<label>Full Name</label><br><br>
<input type="text" name="fullname" placeholder="Enter your full name"><br><br>
<label>Email Address</label><br><br>
<input type="email" name="email" placeholder="Enter your email"><br><br>
<label>Phone Number</label><br><br>
<input type="tel" name="phone" placeholder="Enter your phone number"><br><br>
<label>Subject</label><br><br>
<input type="text" name="subject" placeholder="Enter subject"><br><br>
<label>Message</label><br><br>
<textarea name="message" rows="5" cols="40" placeholder="Write your message"></textarea><br><br>
<input type="submit" value="Send Message">
<input type="reset" value="Clear">

<form>

    <label>Customer Name:</label>
    <input type="text" name="name">
    <br><br>


    <label>Password:</label>
    <input type="password" name="password">
    <br><br>


    <label>Email:</label>
    <input type="email" name="email">
    <br><br>


    <label>Age:</label>
    <input type="number" name="age">
    <br><br>


    <label>Date of Birth:</label>
    <input type="date" name="dob">
    <br><br>


    <label>Preferred Appointment Time:</label>
    <input type="time" name="time">
    <br><br>


    <label>Select Week for Appointment:</label>
    <input type="week" name="week">
    <br><br>


    <label>Gender:</label>
    <br>

    <input type="radio" name="gender" value="male">
    Male

    <input type="radio" name="gender" value="female">
    Female

    <br><br>


    <label>Jewelry Services Required:</label>
    <br>

    <input type="checkbox" name="service">
    Gold Jewelry

    <input type="checkbox" name="service">
    Silver Jewelry

    <input type="checkbox" name="service">
    Jewelry Repair

    <br><br>


    <label>Upload Jewelry Design Image:</label>
    <input type="file" name="file">
    <br><br>


    <label>Search Jewelry:</label>
    <input type="search" name="search">
    <br><br>


    <label>Select Country:</label>

    <select>
        <option>Pakistan</option>
        <option>India</option>
        <option>USA</option>
        <option>UK</option>
    </select>

    <br><br>


    <label>Select Favorite Jewelry Color:</label>
    <input type="color" name="color">
    <br><br>


    <label>Jewelry Budget Range:</label>
    <br>

    <input type="range" min="1000" max="100000" name="budget">

    <br><br>


    <label>Message:</label>
    <br>

    <textarea rows="5" cols="30">
Write your message here...
    </textarea>

    <br><br>


    <input type="submit" value="Submit">

    <input type="reset" value="Reset">


</form>


<footer>
    <p>Singhar Jewelers © 2026 All Rights Reserved</p>
</footer>
</form>
</body>
</html>
